<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>mxui web client</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 -apple-system, 'Segoe UI', sans-serif;
         background:#313338; color:#dbdee1; display:flex; flex-direction:column;
         height:100vh; }
  header { background:#2b2d31; padding:12px 16px; border-bottom:1px solid #1e1f22;
           display:flex; gap:10px; align-items:center; }
  header h1 { font-size:15px; margin:0; flex:1; color:#f2f3f5; }
  input, button, select, textarea { font:inherit; }
  input, textarea { background:#1e1f22; color:#dbdee1;
          border:1px solid #111214; border-radius:4px; padding:6px 8px; }
  #login { max-width:340px; margin:auto; display:flex; flex-direction:column; gap:8px; }
  #login label { font-size:12px; color:#949ba4; }
  #room { display:flex; flex-direction:column; flex:1; overflow:hidden; }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex;
          flex-direction:column; gap:10px; }
  .msg { background:#2b2d31; border-radius:8px; padding:10px 12px; max-width:640px; }
  .msg .who { font-size:12px; color:#949ba4; margin-bottom:2px; }
  .msg .txt { white-space:pre-wrap; }
  .msg.edited .txt::after { content:" (edited)"; font-size:11px; color:#949ba4; }
  .mxui-buttons { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .mxui-btn { border:none; border-radius:4px; padding:6px 14px; cursor:pointer;
              font-weight:500; color:#fff; }
  .mxui-btn.primary { background:#5865f2; }
  .mxui-btn.danger  { background:#da373c; }
  .mxui-btn.default { background:#4e5058; }
  .mxui-btn:disabled { opacity:.45; cursor:default; }
  .mxui-select { background:#1e1f22; color:#dbdee1; border:1px solid #111214;
                 border-radius:4px; padding:6px 8px; }
  #composer { display:flex; gap:8px; padding:12px 16px; background:#2b2d31;
              border-top:1px solid #1e1f22; }
  #composer input { flex:1; }
  #send { background:#5865f2; color:#fff; border:none; border-radius:4px;
          padding:6px 16px; cursor:pointer; }
  #status { padding:6px 16px; font-size:12px; color:#949ba4;
            background:#2b2d31; border-top:1px solid #1e1f22; }
  #modalBack { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
               align-items:center; justify-content:center; }
  #modalBack.open { display:flex; }
  #modal { background:#313338; border-radius:8px; min-width:380px; max-width:480px;
           padding:18px; border:1px solid #1e1f22; }
  #modal h3 { margin:0 0 12px; font-size:16px; color:#f2f3f5; }
  #modal label { display:block; font-size:12px; color:#949ba4; margin:10px 0 4px; }
  #modal input, #modal select { width:100%; }
  #modal .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>
<header><h1>mxui — interactive Matrix</h1><span id="who"></span></header>

<div id="login">
  <label>Homeserver <input id="hs" value="http://localhost:6167"></label>
  <label>Username <input id="user" value="mxui-clicker"></label>
  <label>Password <input id="pass" type="password" value="clicker-pass-1"></label>
  <label>Room <input id="roomIn" value="#mxui-demo:macbook.tailfddf66.ts.net"></label>
  <button id="go">Sign in</button>
  <div id="lerr" style="color:#da373c;font-size:13px"></div>
</div>

<div id="room" style="display:none">
  <div id="msgs"></div>
  <div id="composer">
    <input id="draft" placeholder="Message, or /command…" autocomplete="off">
    <button id="send">Send</button>
  </div>
  <div id="status">connecting…</div>
</div>

<div id="modalBack">
  <div id="modal">
    <h3 id="modalTitle">Dialog</h3>
    <div id="modalFields"></div>
    <div class="row">
      <button class="mxui-btn default" id="modalCancel">Cancel</button>
      <button class="mxui-btn primary" id="modalSubmit">Submit</button>
    </div>
  </div>
</div>

<script>
'use strict';
let acc = null, userId = null, roomId = null, since = null, users = {};
let openModal = null; // {action, spec, eventId}

const $ = id => document.getElementById(id);

async function api(method, path, body) {
  const r = await fetch($('hs').value + path, {
    method,
    headers: Object.assign({'Content-Type': 'application/json'},
      acc ? {Authorization: 'Bearer ' + acc} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error || r.status));
  return j;
}

$('go').onclick = async () => {
  $('lerr').textContent = '';
  try {
    const j = await api('POST', '/_matrix/client/v3/login', {
      type: 'm.login.password',
      identifier: {type: 'm.id.user', user: $('user').value},
      password: $('pass').value
    });
    acc = j.access_token; userId = j.user_id;
    const jr = await api('POST', '/_matrix/client/v3/join/' +
      encodeURIComponent($('roomIn').value), {});
    roomId = jr.room_id;
    $('login').style.display = 'none';
    $('room').style.display = 'flex';
    $('who').textContent = userId;
    $('status').textContent = 'connected — room ' + roomId;
    $('draft').focus();
    syncLoop();
  } catch (e) { $('lerr').textContent = e.message; }
};

async function syncLoop() {
  for (;;) {
    try {
      const q = '/_matrix/client/v3/sync?timeout=15000' +
        (since ? '&since=' + encodeURIComponent(since) : '');
      const j = await api('GET', q);
      since = j.next_batch;
      const r = j.rooms && j.rooms.join && j.rooms.join[roomId];
      if (r) {
        handleEvents(r.state && r.state.events || [], false);
        handleEvents(r.timeline.events || [], !firstSync);
        firstSync = false;
      }
    } catch (e) {
      $('status').textContent = 'sync error: ' + e.message;
      await new Promise(res => setTimeout(res, 2000));
    }
  }
}

const compByMsg = {};   // fallbackEventId -> blocks[]
const editedBodies = {} // originalEventId -> new body

let firstSync = true;
function handleEvents(events, liveEvents) {
  for (const ev of events) {
    if (ev.type === 'm.room.member') users[ev.sender] =
      (ev.content.displayname || ev.sender);
    if (ev.type === 'io.mxui.component_message') {
      const rel = ev.content['m.relates_to'] &&
                  ev.content['m.relates_to'].event_id;
      if (rel) compByMsg[rel] = ev.content.blocks || [];
    }
    if (ev.type === 'io.mxui.modal_present') {
      const act = ev.content.action;
      // only open modals from live timeline events, never initial history sync
      if (act && act.userId === userId && liveEvents) openModalDialog(act, ev.content, ev.event_id);
    }
    if (ev.type === 'm.room.message') {
      const rel = ev.content['m.relates_to'] || {};
      const target = rel.event_id;
      if (rel.rel_type === 'm.replace' && target) {
        editedBodies[target] = ev.content['m.new_content'].body;
        updateMsgDom(target);
      } else if (ev.content.msgtype === 'm.text') {
        renderMsg(ev);
      }
    }
  }
}

const msgEls = new Map(); // raw event id -> element
window.__renders = [];
function renderMsg(ev) {
  const id = ev.event_id;
  let el = msgEls.get(id);
  window.__renders.push((ev.content.body||'').slice(0,30));
  if (!el) {
    el = document.createElement('div');
    el.className = 'msg';
    const who = document.createElement('div'); who.className = 'who';
    who.textContent = users[ev.sender] || ev.sender;
    const txt = document.createElement('div'); txt.className = 'txt';
    el.append(who, txt);
    $('msgs').appendChild(el);
    msgEls.set(id, el);
  }
  updateMsgDom(id, ev);
  const nearBottom = $('msgs').scrollHeight - $('msgs').scrollTop -
                     $('msgs').clientHeight < 200;
  if (nearBottom) $('msgs').scrollTop = $('msgs').scrollHeight;
}

function updateMsgDom(id, ev) {
  const el = msgEls.get(id);
  if (!el) return;
  const body = editedBodies[id] !== undefined ? editedBodies[id] :
    (ev ? ev.content.body : el.dataset.body);
  if (ev) el.dataset.body = ev.content.body;
  const txt = el.querySelector('.txt');
  if (txt && body !== undefined) txt.textContent = body;
  el.classList.toggle('edited', editedBodies[id] !== undefined);
  const resolved = /\b(Approved|Rejected|Deploying|Scheduled)\b/.test(body || '');
  const btns = el.querySelector('.mxui-buttons');
  if (btns && resolved) btns.querySelectorAll('button,select').forEach(b => b.disabled = true);
}

function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/[^a-zA-Z0-9_-]/g, '_'); }

setInterval(() => {
  for (const [msgId, blocks] of Object.entries(compByMsg)) {
    const el = msgEls.get(msgId);
    if (!el || el.querySelector('.mxui-buttons')) continue;
    const wrap = document.createElement('div'); wrap.className = 'mxui-buttons';
    for (const b of blocks) for (const c of b.components || []) {
      if (c.type === 'select') {
        const sel = document.createElement('select');
        sel.className = 'mxui-select';
        for (const o of c.options || []) {
          const op = document.createElement('option');
          op.value = o.value; op.textContent = o.label || o.value;
          sel.appendChild(op);
        }
        sel.onchange = () => { sel.dataset.chosen = sel.value; };
        sel.dataset.chosen = (c.options && c.options[0] || {}).value || '';
        wrap.appendChild(sel);
      } else {
        const btn = document.createElement('button');
        btn.className = 'mxui-btn ' + (c.style || 'default');
        btn.textContent = c.label;
        btn.onclick = () => click(msgId, c, btn);
        wrap.appendChild(btn);
      }
    }
    if (wrap.children.length) el.appendChild(wrap);
  }
}, 300);

async function click(msgId, comp, btn) {
  if (btn) btn.disabled = true;
  $('status').textContent = 'sending interaction…';
  try {
    const sel = btn && btn.parentElement.querySelector('.mxui-select');
    await api('PUT', '/_matrix/client/v3/rooms/' + encodeURIComponent(roomId) +
      '/send/io.mxui.component_action/' + Date.now(), {
        interactionId: msgId + '|' + comp.id,
        messageEvent: msgId,
        componentId: comp.id,
        value: sel ? sel.dataset.chosen : (comp.value || ''),
        userId: userId,
        roomId: roomId,
        ts: Math.floor(Date.now() / 1000)
      });
    $('status').textContent = 'interaction sent — waiting for bot…';
  } catch (e) {
    if (btn) btn.disabled = false;
    $('status').textContent = 'interaction failed: ' + e.message;
  }
}

// ---- composer: plain message or /command ----
async function send() {
  const t = $('draft').value.trim();
  if (!t) return;
  $('draft').value = '';
  if (t.startsWith('/')) {
    const sp = t.indexOf(' ');
    const cmd = sp < 0 ? t.slice(1) : t.slice(1, sp);
    const arg = sp < 0 ? '' : t.slice(sp + 1);
    await api('PUT', '/_matrix/client/v3/rooms/' + encodeURIComponent(roomId) +
      '/send/io.mxui.command/' + Date.now(), {
        command: cmd, args: arg, userId: userId, roomId: roomId,
        ts: Math.floor(Date.now() / 1000)
      });
    $('status').textContent = 'command /' + cmd + ' sent…';
  } else {
    await api('PUT', '/_matrix/client/v3/rooms/' + encodeURIComponent(roomId) +
      '/send/m.room.message/' + Date.now(), {
        msgtype: 'm.text', body: t
      });
  }
}
$('send').onclick = send;
$('draft').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// ---- modals ----
function openModalDialog(action, spec, eventId) {
  openModal = {action, spec, eventId};
  $('modalTitle').textContent = spec.title || 'Dialog';
  const f = $('modalFields'); f.innerHTML = '';
  for (const fld of spec.fields || []) {
    const lbl = document.createElement('label');
    lbl.textContent = fld.label || fld.id;
    f.appendChild(lbl);
    let input;
    if (fld.type === 'select') {
      input = document.createElement('select');
      input.className = 'mxui-select';
      for (const o of fld.options || []) {
        const op = document.createElement('option');
        op.value = o.value; op.textContent = o.label || o.value;
        input.appendChild(op);
      }
    } else {
      input = document.createElement('input');
      input.type = fld.type === 'number' ? 'number' : 'text';
      if (fld.placeholder) input.placeholder = fld.placeholder;
    }
    input.id = 'mf-' + fld.id;
    f.appendChild(input);
  }
  $('modalBack').classList.add('open');
}

$('modalCancel').onclick = () => { $('modalBack').classList.remove('open'); openModal = null; };
$('modalSubmit').onclick = async () => {
  if (!openModal) return;
  const values = {};
  for (const fld of openModal.spec.fields || []) {
    const el = $('mf-' + fld.id);
    if (el) values[fld.id] = el.value;
  }
  try {
    await api('PUT', '/_matrix/client/v3/rooms/' + encodeURIComponent(roomId) +
      '/send/io.mxui.modal_submit/' + Date.now(), {
        modalEvent: openModal.eventId,
        action: openModal.action,
        values: values,
        userId: userId, roomId: roomId,
        ts: Math.floor(Date.now() / 1000)
      });
    $('status').textContent = 'modal submitted — waiting for bot…';
  } catch (e) { $('status').textContent = 'modal submit failed: ' + e.message; }
  $('modalBack').classList.remove('open'); openModal = null;
};
</script>
</body>
</html>
